# Preserve the browser-facing protocol supplied by the TLS proxy. Direct HTTP traffic still
# falls back to nginx's own scheme, which keeps the same image usable without TLS in dev.
map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the proxy ceiling aligned with the API's configured upload limit.
    client_max_body_size ${MAX_UPLOAD_SIZE};

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    # API and SSE are proxied to the backend container.
    location /api/ {
        proxy_pass http://${API_HOST}:${API_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location ~* \.(js|css|woff2|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
