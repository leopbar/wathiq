[project]
name = "wathiq-api"
version = "0.1.0"
description = "Wathiq — assurance-first intelligent document processing API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.43",
    "psycopg[binary,pool]>=3.2",
    "greenlet>=3.1",
    "alembic>=1.16",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=2.2",
    "pgvector>=0.3",
    "reportlab>=4.4,<5",
    "pypdf>=6,<7",
    "arabic-reshaper>=3,<4",
    "python-bidi>=0.6,<1",
    "pillow>=11,<13",
]

[project.optional-dependencies]
# The Azure SDKs are an *extra*, not a core dependency, and every one of them is imported
# lazily inside the adapter that needs it. That is what lets `WATHIQ_MODE=demo` run on a
# machine where none of this is installed — which is the promise M1 made and M6 has to keep.
# The deployed image installs the extra, so one image serves both modes.
azure = [
    # Models and embeddings (Azure AI Foundry speaks the OpenAI protocol).
    "openai>=1.60,<3",
    # Managed identity / workload identity. Every adapter prefers this over a key.
    "azure-identity>=1.19,<2",
    # OCR with geometry and per-word confidence.
    "azure-ai-documentintelligence>=1.0,<2",
    # RAG over the policy pack.
    "azure-search-documents>=11.6,<12",
    # Document storage with a hierarchical namespace and user-delegation SAS.
    "azure-storage-file-datalake>=12.18,<13",
    # OpenTelemetry export to Application Insights.
    "azure-monitor-opentelemetry>=1.6,<2",
    # Submitting the calibration fit as a managed job.
    "azure-ai-ml>=1.23,<2",
    # RS256 verification of Entra tokens. PyJWT is already a core dependency, but it can only
    # verify RSA signatures when `cryptography` is present.
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.13",
    "anyio>=4.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI dependency injection uses calls in defaults

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Arabic names make these table rows long; splitting them would hurt readability.
"app/db/seed_data.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    # Tests that call a real Azure service. They skip themselves unless the matching endpoint
    # is configured, so the default run — and CI — never needs a key and never spends money.
    #   docker compose exec api pytest -m azure
    "azure: needs live Azure services; skipped unless the endpoints are configured",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
