name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Everything runs in containers, exactly as it does on a developer machine.
env:
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `--config` points at .gitleaks.toml, which extends the default rules rather than
      # replacing them and allowlists only exact, named values — the Azure built-in role
      # definition GUIDs, which are public, identical in every tenant, and grant nothing on
      # their own. No file or rule is exempted wholesale.
      - name: Run gitleaks in Docker
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --no-banner --verbose

      # The allowlist must not have blinded the scanner: a planted key has to still be caught.
      - name: The scanner must still catch a real secret
        run: |
          printf 'aws_secret_access_key = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"\n' \
            > canary-secret.env
          if docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
               detect --source=/repo --config=/repo/.gitleaks.toml \
               --no-git --redact --no-banner; then
            rm -f canary-secret.env
            echo "::error::gitleaks did not flag a planted secret - the config is too permissive"
            exit 1
          fi
          rm -f canary-secret.env
          echo "gitleaks correctly flagged the planted secret"

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker compose build api

      - name: Start the database and the MCP tool servers
        # The pipeline's integration tests call the real MCP servers. Leaving them out would
        # not make the tests fail loudly — it would make the agent record "could not check",
        # which is a different outcome from the one being tested.
        run: docker compose up -d db mcp-document-store mcp-company-registry mcp-sanctions mcp-core-banking

      - name: Lint
        run: docker compose run --rm --no-deps --entrypoint ruff api check .

      - name: Unit and integration tests
        run: |
          docker compose run --rm \
            -e WATHIQ_DATABASE_URL=postgresql+psycopg://wathiq:wathiq@db:5432/wathiq_test \
            --entrypoint pytest api -q

      - name: Quality regression gate (five bands)
        run: docker compose run --rm --no-deps --entrypoint python api -m app.quality.cli

      - name: Prove the gate rejects broken results
        run: |
          set +e
          docker compose run --rm --no-deps --entrypoint python api -m app.quality.cli --negative-control
          result=$?
          test "$result" -eq 1

      - name: Stop
        if: always()
        run: docker compose down -v

  mcp:
    name: MCP servers (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the MCP test image
        run: docker compose --profile test build mcp-tests

      - name: Lint
        run: docker compose --profile test run --rm --entrypoint ruff mcp-tests check .

      - name: Tests
        # These drive the servers in-process through the official MCP client, so nothing has
        # to be listening for them to run.
        run: docker compose --profile test run --rm mcp-tests

  frontend:
    name: Frontend (typecheck + build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build stage runs `tsc --noEmit && vite build`, so a type error fails here.
      - name: Build the web image
        run: docker compose build web

      - name: Lint
        run: docker compose run --rm --no-deps --entrypoint npm web run lint

  infra:
    name: Infrastructure (Bicep + Helm + shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compiling the Bicep catches a bad property or a wrong API version here rather than
      # halfway through a deployment, after a resource group has already been created.
      - name: Compile the Bicep
        run: az bicep build --file infra/bicep/main.bicep --stdout > /dev/null

      - name: Fail on any Bicep warning
        run: |
          # `az bicep build` exits 0 with warnings, so the warnings have to be inspected.
          # A warning here is usually a real mistake: a property the resource type does not
          # have, or a conditional module accessed without `!`.
          az bicep build --file infra/bicep/main.bicep --stdout 2> bicep.err > /dev/null
          if grep -q "Warning" bicep.err; then
            echo "::error::Bicep produced warnings:"; cat bicep.err; exit 1
          fi
          echo "Bicep compiled with no warnings"

      - name: Lint the Helm chart
        run: |
          docker run --rm -v "$PWD/infra/helm:/charts" alpine/helm:3.16.2 lint /charts/wathiq             --set image.registry=ci.azurecr.io             --set workloadIdentity.clientId=00000000-0000-0000-0000-000000000000             --set keyVault.name=ci-kv --set keyVault.tenantId=ci-tenant             --set postgres.host=ci.postgres.database.azure.com

      # Rendering and validating catches a manifest that Helm is happy with and Kubernetes is
      # not — a misspelled field, a wrong apiVersion, a probe in the wrong place.
      - name: Render and validate the manifests
        run: |
          docker run --rm -v "$PWD/infra/helm:/charts" alpine/helm:3.16.2 template wathiq /charts/wathiq             --set image.registry=ci.azurecr.io             --set workloadIdentity.clientId=00000000-0000-0000-0000-000000000000             --set keyVault.name=ci-kv --set keyVault.tenantId=ci-tenant             --set postgres.host=ci.postgres.database.azure.com > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:latest             -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0 < rendered.yaml

      # A CRLF in these is a broken container, and it never shows up on Windows.
      - name: Shellcheck the deploy and teardown scripts
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:stable             infra/scripts/deploy.sh infra/teardown/teardown.sh

      # The teardown's guards are the thing standing between a typo and someone else's
      # resource group. They are asserted here, not just reviewed.
      - name: The teardown must refuse a group that is not its own
        run: |
          if bash infra/teardown/teardown.sh some-other-rg --yes 2>/dev/null; then
            echo "::error::teardown accepted a resource group not on its allow-list"; exit 1
          fi
          echo "teardown correctly refused a group outside its allow-list"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend, mcp]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build api web mcp-company-registry

      - name: Start the stack
        run: docker compose up -d db api web mcp-document-store mcp-company-registry mcp-sanctions mcp-core-banking

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz | grep -q '"db":"ok"'; then
              echo "api is ready"; exit 0
            fi
            sleep 3
          done
          echo "api did not become healthy"; docker compose logs api; exit 1

      - name: Wait for the web app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/ >/dev/null; then echo "web is ready"; exit 0; fi
            sleep 3
          done
          echo "web did not become ready"; docker compose logs web; exit 1

      - name: Run Playwright tests
        run: docker compose --profile test run --rm e2e

      - name: Collect the report
        if: always()
        run: |
          docker compose --profile test run --rm --no-deps --entrypoint sh e2e \
            -c "cp -r /e2e/playwright-report /e2e/tests/../playwright-report-out 2>/dev/null || true"
          docker cp "$(docker compose ps -aq e2e | head -n1):/e2e/playwright-report" \
            ./playwright-report 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
