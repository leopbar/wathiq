[project]
name = "wathiq-mcp-servers"
version = "0.1.0"
description = "Wathiq MCP tool servers: document store, company registry, sanctions, core banking"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2",
    "uvicorn[standard]>=0.37",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.6",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["wathiq_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wathiq_mcp"]
