{{/*
The service account is the whole identity story in fifteen lines.

A pod using this account gets a projected token from the cluster's OIDC issuer. The
`azure.workload.identity/client-id` annotation tells the Azure SDKs inside the pod which
user-assigned identity to exchange that token for, and the federated credential in
modules/identity.bicep is what makes Entra accept the exchange.

The result: no key, no connection string, no secret in any manifest for any Azure service.
`app/azure/credentials.py` prefers this path everywhere and only falls back to an API key when
one is explicitly configured for local development.

The account NAME matters. It is half of the federated credential's subject
(`system:serviceaccount:<namespace>:<name>`), so renaming it here without changing the Bicep
breaks every Azure call with an authentication error that does not mention names at all.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wathiq.labels" . | nindent 4 }}
  {{- if .Values.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId must be set (the Bicep output)" .Values.workloadIdentity.clientId | quote }}
  {{- end }}
# No automatic API token: nothing in Wathiq calls the Kubernetes API. The workload identity
# token is projected separately by the webhook and is unaffected by this.
automountServiceAccountToken: false
