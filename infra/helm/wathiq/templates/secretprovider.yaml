{{/*
Key Vault → Kubernetes Secret, via the CSI driver.

Only two secrets exist in the whole system: the database password and the JWT signing key.
Everything else — models, OCR, content safety, storage, search, Azure ML — authenticates with
the workload identity and has no secret at all. That is the payoff for preferring managed
identity in `app/azure/credentials.py`, and it is why this file is short.

**Why the CSI driver rather than pasting secrets into a Helm value.** A `--set` value ends up
in the release's stored manifest, in `helm get values`, in anyone's shell history and in CI
logs. Here the value never leaves Key Vault until the driver mounts it into the pod, the
identity that may read it is the pod's own, and rotating it in the vault refreshes the mount
within `rotationPollInterval` — no redeploy.

**`secretObjects` is what makes them environment variables.** The driver's primary job is to
mount secrets as *files*; `secretObjects` additionally mirrors them into a real Kubernetes
Secret, which is what `secretKeyRef` in `_helpers.tpl` reads. The mount must still be attached
to the pod for the sync to happen — that is why every Deployment carries the volume even
though nothing reads the files.
*/}}
{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "wathiq.fullname" . }}-kv
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wathiq.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # Authenticate to Key Vault as the workload identity — the same identity everything else
    # uses, so there is exactly one answer to "what can Wathiq read".
    clientID: {{ required "workloadIdentity.clientId must be set" .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "keyVault.name must be set (the Bicep output)" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId must be set" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ . }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ include "wathiq.fullname" . }}-secrets
      type: Opaque
      data:
        {{- range .Values.keyVault.secrets }}
        - objectName: {{ . }}
          key: {{ . }}
        {{- end }}
{{- end }}
