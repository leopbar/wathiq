# Wathiq — local development stack.
#   docker compose up --build            start everything (hot reload)
#   docker compose --profile process up  also start Orkes Conductor (needs ~2 GB more RAM)
#   docker compose --profile test run --rm e2e   run the Playwright end-to-end tests
#
# Production images are built from the same Dockerfiles: see compose.prod.yaml.

name: wathiq

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wathiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wathiq}
      POSTGRES_DB: ${POSTGRES_DB:-wathiq}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wathiq} -d ${POSTGRES_DB:-wathiq}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: dev
    environment:
      WATHIQ_MODE: ${WATHIQ_MODE:-demo}
      WATHIQ_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wathiq}:${POSTGRES_PASSWORD:-wathiq}@db:5432/${POSTGRES_DB:-wathiq}
      WATHIQ_JWT_SECRET: ${WATHIQ_JWT_SECRET:-dev-only-insecure-secret-change-me}
      WATHIQ_DEMO_PASSWORD: ${WATHIQ_DEMO_PASSWORD:-Wathiq!Demo2026}
      WATHIQ_LOG_LEVEL: ${WATHIQ_LOG_LEVEL:-INFO}
      WATHIQ_BUILD_SHA: ${WATHIQ_BUILD_SHA:-dev}
      WATHIQ_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      WATHIQ_STORAGE_DIR: /app/storage
      # MCP tool servers. Each node of the graph is given only the ones it needs.
      WATHIQ_MCP_DOCUMENT_STORE_URL: http://mcp-document-store:9101/mcp
      WATHIQ_MCP_COMPANY_REGISTRY_URL: http://mcp-company-registry:9102/mcp
      WATHIQ_MCP_SANCTIONS_URL: http://mcp-sanctions:9103/mcp
      WATHIQ_MCP_CORE_BANKING_URL: http://mcp-core-banking:9104/mcp
      # Azure mode only — read from .env when present, harmless in demo mode.
      WATHIQ_AZURE_OPENAI_ENDPOINT: ${WATHIQ_AZURE_OPENAI_ENDPOINT:-}
      WATHIQ_AZURE_OPENAI_DEPLOYMENT: ${WATHIQ_AZURE_OPENAI_DEPLOYMENT:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      # Mounted so `docker compose run --rm api pytest` picks up edits without a rebuild.
      - ./backend/tests:/app/tests
      - api-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---- MCP tool servers ---------------------------------------------------
  # Four separate processes, not four functions in the API. That is what makes least
  # privilege real: the investigator is handed the registry and the sanctions list, and has
  # no address for core banking, which is the only server that can write anything.
  mcp-document-store:
    build:
      context: ./mcp_servers
    command: ["python", "-m", "wathiq_mcp.document_store"]
    environment:
      MCP_PORT: "9101"
      MCP_ALLOWED_HOSTS: mcp-document-store,localhost,127.0.0.1
      WATHIQ_STORAGE_DIR: /storage
    volumes:
      # Read-only on purpose: this server cannot alter a customer's document even if asked.
      - api-storage:/storage:ro
    restart: unless-stopped

  mcp-company-registry:
    build:
      context: ./mcp_servers
    command: ["python", "-m", "wathiq_mcp.company_registry"]
    environment:
      MCP_PORT: "9102"
      MCP_ALLOWED_HOSTS: mcp-company-registry,localhost,127.0.0.1
    restart: unless-stopped

  mcp-sanctions:
    build:
      context: ./mcp_servers
    command: ["python", "-m", "wathiq_mcp.sanctions"]
    environment:
      MCP_PORT: "9103"
      MCP_ALLOWED_HOSTS: mcp-sanctions,localhost,127.0.0.1
    restart: unless-stopped

  mcp-core-banking:
    build:
      context: ./mcp_servers
    command: ["python", "-m", "wathiq_mcp.core_banking"]
    environment:
      MCP_PORT: "9104"
      MCP_ALLOWED_HOSTS: mcp-core-banking,localhost,127.0.0.1
    restart: unless-stopped

  # The MCP servers' own tests. They drive the servers in-process through the official MCP
  # client, so no server has to be running for them to pass.
  #   docker compose --profile test run --rm mcp-tests
  mcp-tests:
    build:
      context: ./mcp_servers
      target: dev
    profiles: ["test"]
    volumes:
      - ./mcp_servers/tests:/app/tests
      - ./mcp_servers/wathiq_mcp:/app/wathiq_mcp

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    depends_on:
      - api
    restart: unless-stopped

  # ---- heavy, opt-in ------------------------------------------------------
  conductor:
    image: conductoross/conductor-standalone:3.15.0
    profiles: ["process"]
    ports:
      - "${CONDUCTOR_PORT:-8080}:8080"
      - "${CONDUCTOR_UI_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  e2e:
    build:
      context: ./e2e
    profiles: ["test"]
    environment:
      E2E_BASE_URL: http://web:5173
      E2E_API_URL: http://api:8000
    volumes:
      - ./e2e/tests:/e2e/tests
      - ./e2e/playwright.config.ts:/e2e/playwright.config.ts
      - e2e-report:/e2e/playwright-report
    depends_on:
      - web
      - api

volumes:
  db-data:
  api-storage:
  e2e-report:
