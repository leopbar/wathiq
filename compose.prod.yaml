# Production-shaped stack: built images, no bind mounts, no hot reload.
#   docker compose -f compose.yaml -f compose.prod.yaml up --build -d
# The web container serves the built assets on :8080 and proxies /api to the api container.

name: wathiq

services:
  api:
    build:
      context: ./backend
      target: prod
    environment:
      WATHIQ_LOG_LEVEL: ${WATHIQ_LOG_LEVEL:-INFO}
      WATHIQ_CORS_ORIGINS: ${WATHIQ_CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - api-storage:/app/storage
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./frontend
      target: prod
    environment: {}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes: []

volumes:
  api-storage:
